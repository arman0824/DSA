name: Sync LeetCode

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'  # Runs automatically every day at midnight UTC

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync LeetCode Solutions
        uses: joshcai/leetcode-sync@v1.7.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          leetcode-csrf-token: ""
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          destination-folder: my-leetcode-solutions